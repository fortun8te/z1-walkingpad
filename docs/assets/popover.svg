<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style>
      .title { fill: #f2f2f5; font-weight: 600; }
      .body { fill: #e8e8ea; }
      .dim { fill: #9a9aa0; }
      .cell { fill: #34343a; }
      .pill { fill: #3d3d44; }
      .sep { stroke: #44444b; stroke-width: 1; }
    </style>
  </defs>

  <!-- wallpaper backdrop -->
  <rect width="360" height="640" fill="#101014"/>

  <!-- macOS menu bar -->
  <rect x="0" y="0" width="360" height="26" fill="#1c1c21"/>
  <rect x="0" y="25.5" width="360" height="0.5" fill="#33333a"/>
  <text x="14" y="17.5" font-size="11" class="dim">Fri 31 Jul</text>
  <!-- menu bar extra: walking figure + live speed -->
  <g transform="translate(300,13)">
    <circle cx="-14" cy="-5.2" r="2.1" fill="#f2f2f5"/>
    <path d="M-14 -3 L-14.6 1.5 M-14.6 1.5 L-17.5 6 M-14.6 1.5 L-11.5 5.6 M-14.2 -2 L-17.6 0.4 M-14.2 -2 L-10.8 -0.2" stroke="#f2f2f5" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <text x="-4" y="4.5" font-size="11.5" class="title" text-anchor="start">2.5</text>
  </g>

  <!-- popover -->
  <rect x="30" y="42" width="300" height="556" rx="14" fill="#26262c" stroke="#3f3f46" stroke-width="1"/>

  <!-- connection row -->
  <circle cx="52" cy="70" r="4" fill="#32d74b"/>
  <text x="64" y="68" font-size="13" class="title">KS-HD-Z1D</text>
  <text x="64" y="83" font-size="10" class="dim">Connected</text>
  <rect x="242" y="61" width="72" height="20" rx="10" class="pill"/>
  <text x="278" y="74.5" font-size="10" class="body" text-anchor="middle">Disconnect</text>

  <!-- speed control -->
  <g>
    <circle cx="76" cy="132" r="17" class="pill"/>
    <rect x="69" y="131" width="14" height="2" rx="1" fill="#f2f2f5"/>
    <text x="180" y="144" font-size="40" font-weight="600" class="title" text-anchor="middle">2.5</text>
    <text x="216" y="142" font-size="14" class="dim">mph</text>
    <circle cx="284" cy="132" r="17" class="pill"/>
    <rect x="277" y="131" width="14" height="2" rx="1" fill="#f2f2f5"/>
    <rect x="283" y="125" width="2" height="14" rx="1" fill="#f2f2f5"/>
  </g>

  <!-- stop button -->
  <rect x="46" y="168" width="268" height="32" rx="8" fill="#ff453a"/>
  <rect x="130" y="178" width="11" height="11" rx="2" fill="#ffffff"/>
  <text x="196" y="189" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Stop</text>

  <!-- stats grid -->
  <g font-size="9" class="dim">
    <rect x="46" y="214" width="130" height="58" rx="8" class="cell"/>
    <text x="58" y="233">⏱ ELAPSED</text>
    <text x="58" y="258" font-size="17" font-weight="600" class="body">12:34</text>

    <rect x="184" y="214" width="130" height="58" rx="8" class="cell"/>
    <text x="196" y="233">➤ DISTANCE</text>
    <text x="196" y="258" font-size="17" font-weight="600" class="body">0.52 mi</text>

    <rect x="46" y="280" width="130" height="58" rx="8" class="cell"/>
    <text x="58" y="299">👟 STEPS</text>
    <text x="58" y="324" font-size="17" font-weight="600" class="body">1,204</text>

    <rect x="184" y="280" width="130" height="58" rx="8" class="cell"/>
    <text x="196" y="299">🔥 KCAL (EST.)</text>
    <text x="196" y="324" font-size="17" font-weight="600" class="body">48.6</text>
  </g>

  <!-- last session -->
  <text x="180" y="360" font-size="10" class="dim" text-anchor="middle">Last session: 25:36 · 1.02 mi · 2,104 steps · 92.5 kcal</text>

  <line x1="46" y1="378" x2="314" y2="378" class="sep"/>

  <!-- settings -->
  <text x="46" y="396" font-size="10" class="dim">SETTINGS</text>
  <rect x="46" y="404" width="268" height="24" rx="6" class="pill"/>
  <rect x="46" y="404" width="134" height="24" rx="6" fill="#636366"/>
  <text x="113" y="420" font-size="11" class="title" text-anchor="middle">Imperial</text>
  <text x="247" y="420" font-size="11" class="dim" text-anchor="middle">Metric</text>

  <text x="46" y="452" font-size="12" class="body">⚖ Body weight</text>
  <rect x="228" y="438" width="54" height="20" rx="5" fill="#1c1c21" stroke="#3f3f46" stroke-width="1"/>
  <text x="255" y="452" font-size="11" class="body" text-anchor="middle">165</text>
  <text x="292" y="452" font-size="11" class="dim">lb</text>

  <text x="46" y="484" font-size="12" class="body">Speed per −/+ tap</text>
  <rect x="176" y="470" width="138" height="22" rx="6" class="pill"/>
  <rect x="176" y="470" width="46" height="22" rx="6" fill="#636366"/>
  <text x="199" y="485" font-size="10.5" class="title" text-anchor="middle">0.1</text>
  <text x="245" y="485" font-size="10.5" class="dim" text-anchor="middle">0.2</text>
  <text x="291" y="485" font-size="10.5" class="dim" text-anchor="middle">0.5</text>

  <line x1="46" y1="512" x2="314" y2="512" class="sep"/>

  <!-- pad status line -->
  <circle cx="52" cy="534" r="3.5" fill="#32d74b"/>
  <text x="62" y="538" font-size="10.5" class="dim">Pad display synced · miles</text>

  <!-- exit -->
  <text x="314" y="580" font-size="12" class="body" text-anchor="end">Exit</text>
</svg>
