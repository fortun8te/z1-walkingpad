name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && swift --version
      - name: Build native app and test harness
        working-directory: macos
        run: swift build
      - name: Run native tests with fake transports
        working-directory: macos
        run: swift run z1tests
      - name: Run isolated app model tests
        working-directory: macos
        env:
          Z1_PREVIEW: "1"
        run: swift test --filter Z1AppTests
      - name: Verify app packaging and signature
        env:
          Z1_BUILD_SCRATCH: .build
        run: bash macos/build-app.sh --debug
      - name: Install Python test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install '.[dev]'
      - name: Run read-only MCP and protocol tests
        run: .venv/bin/python -m pytest -q
