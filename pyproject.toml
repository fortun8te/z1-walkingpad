[project]
name = "z1-walkingpad-mcp"
version = "0.1.0"
description = "Read-only local stats MCP for the Z1 WalkingPad macOS app"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
]

[project.optional-dependencies]
mcp = []  # Compatibility extra; MCP is required by the read-only package.
dev = ["pytest", "ruff"]

[project.scripts]
z1-walkingpad = "z1_walkingpad_mcp.server:run"
z1-walkingpad-mcp = "z1_walkingpad_mcp.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/z1_walkingpad_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["docs/legacy-python-tests", "scripts", ".git", ".venv", "macos", "work"]
