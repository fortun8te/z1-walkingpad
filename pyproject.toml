[project]
name = "z1-walkingpad-mcp"
version = "0.1.0"
description = "BLE control and MCP server for the KingSmith WalkingPad Z1 treadmill (FTMS protocol)"
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.22",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest", "ruff"]

[project.scripts]
z1-walkingpad = "z1_walkingpad_mcp.cli:run"
z1-walkingpad-mcp = "z1_walkingpad_mcp.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/z1_walkingpad_mcp"]
